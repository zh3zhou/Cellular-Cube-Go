[DEPENDENCIES]
# Pygbag normalizes gathered Windows paths with a leading slash. Root-level
# ignores therefore keep the slash so descendants are excluded as well.
ignoreDirs = ["/.git", "/.github", "/.pytest_cache", "/.trae", "/.venv", "/assets/screenshots", "/build", "/cellular_cube_go.egg-info", "/cv", "/env", "/tests", "/tools", "/venv", "/《开发》", "**/__pycache__"]
ignoreFiles = [".gitignore", "AGENTS.md", "MIGRATION_AUDIT.md", "PROJECT_CONTEXT.md", "README.md", "TECHNICAL_REPORT.md", "THIRD_PARTY_NOTICES.md", "catalog.v2.json", "import-report.lexicon.json", "import-report.lifewiki.json", "import-report.v2.json", "import-report.v3.json", "library.json", "main_web.py", "proposal.txt", "pygbag.ini", "pyproject.toml", "requirements.txt", "rules.md", "scraper.py", "test_minimal.py", "WEB_GUIDE.md"]

[SETTINGS]
screen_width = 1100
screen_height = 600
fullscreen = false
autorun = true
